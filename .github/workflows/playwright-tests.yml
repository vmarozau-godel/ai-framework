name: Playwright Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel older in-progress runs for the same PR.
  group: playwright-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      # Check out repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up latest LTS Node.js and enable Yarn cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      # Install dependencies with strict lockfile/cache validation.
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      # Install Playwright browsers and required system dependencies.
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      # Run Playwright test suite.
      - name: Run Playwright tests
        run: yarn playwright test

      # Always upload HTML report, even on failure.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: warn

      # Always upload Playwright traces for debugging failed tests.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/**/trace*.zip
            test-results/**/traces/**
          if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      # Check out repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up latest LTS Node.js and enable Yarn cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      # Install dependencies with strict lockfile/cache validation.
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      # Run high/critical dependency vulnerability scan.
      - name: Run dependency audit
        run: |
          set -o pipefail
          yarn audit --level high --json | tee audit-report.jsonl

      # Publish concise audit summary in the GitHub Actions summary.
      - name: Publish audit summary
        if: always()
        run: |
          high_count=$(grep -c '"severity":"high"' audit-report.jsonl || true)
          critical_count=$(grep -c '"severity":"critical"' audit-report.jsonl || true)
          total_count=$((high_count + critical_count))

          {
            echo '## Security Scan Summary'
            echo "- High vulnerabilities: ${high_count}"
            echo "- Critical vulnerabilities: ${critical_count}"
            echo "- Total (high + critical): ${total_count}"
          } >> "$GITHUB_STEP_SUMMARY"
