name: Playwright Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel older in-progress runs for the same PR.
  group: playwright-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      # Check out repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up latest LTS Node.js and enable Yarn cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      # Install dependencies with strict lockfile/cache validation.
      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      # Install Playwright browsers and required system dependencies.
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      # Run Playwright test suite.
      - name: Run Playwright tests
        run: yarn playwright test

      # Always upload HTML report, even on failure.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: warn

      # Always upload Playwright traces for debugging failed tests.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/**/trace*.zip
            test-results/**/traces/**
          if-no-files-found: warn
