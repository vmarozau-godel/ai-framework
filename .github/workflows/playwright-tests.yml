name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel older in-progress runs for the same PR.
  group: playwright-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: ai.test.maintenance

    steps:
      # Check out repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up latest LTS Node.js and enable npm cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ai.test.maintenance/package-lock.json

      # Install dependencies with strict lockfile/cache validation.
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers and required system dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run Playwright test suite.
      - name: Run Playwright tests
        run: npx playwright test

      # Always upload HTML report, even on failure.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ai.test.maintenance/playwright-report
          if-no-files-found: warn

      # Always upload Playwright traces for debugging failed tests.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            ai.test.maintenance/test-results/**/trace*.zip
            ai.test.maintenance/test-results/**/traces/**
          if-no-files-found: warn

      - name: Notify Microsoft Teams on failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH_NAME: ${{ github.head_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(cat <<EOF
          {
            "text": "Playwright workflow failed.\nPR: ${PR_TITLE}\nAuthor: ${PR_AUTHOR}\nBranch: ${BRANCH_NAME}\nRun: ${RUN_URL}"
          }
          EOF
          )
          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: ai.test.maintenance

    steps:
      # Check out repository code.
      - name: Checkout
        uses: actions/checkout@v4

      # Set up latest LTS Node.js and enable npm cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ai.test.maintenance/package-lock.json

      # Install dependencies with strict lockfile/cache validation.
      - name: Install dependencies
        run: npm ci

      # Run high/critical dependency vulnerability scan.
      - name: Run dependency audit
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee audit-report.jsonl

      # Publish concise audit summary in the GitHub Actions summary.
      - name: Publish audit summary
        if: always()
        run: |
          high_count=$(grep -c '"severity":"high"' audit-report.jsonl || true)
          critical_count=$(grep -c '"severity":"critical"' audit-report.jsonl || true)
          total_count=$((high_count + critical_count))

          {
            echo '## Security Scan Summary'
            echo "- High vulnerabilities: ${high_count}"
            echo "- Critical vulnerabilities: ${critical_count}"
            echo "- Total (high + critical): ${total_count}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: playwright-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Playwright HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report
          path: ai.test.maintenance/playwright-report

      # Build or extend report history for GitHub Pages publication.
      - name: Prepare report history
        run: |
          set -euo pipefail
          mkdir -p ai.test.maintenance/playwright-report

          PREV_HISTORY_FILE="$(mktemp)"
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            if git show origin/gh-pages:history.json > "$PREV_HISTORY_FILE" 2>/dev/null; then
              echo "Loaded previous history.json from gh-pages"
            else
              echo '[]' > "$PREV_HISTORY_FILE"
            fi
          else
            echo '[]' > "$PREV_HISTORY_FILE"
          fi

          COUNTS_FILE="$(mktemp)"
          echo '{"tests_total":null,"tests_passed":null,"tests_failed":null,"tests_flaky":null,"tests_skipped":null}' > "$COUNTS_FILE"
          if [ -f ai.test.maintenance/playwright-report/data/test-results.json ]; then
            jq -c '{
              tests_total: (.stats.total // .total // null),
              tests_passed: (.stats.expected // .passed // null),
              tests_failed: (.stats.unexpected // .failed // null),
              tests_flaky: (.stats.flaky // .flaky // null),
              tests_skipped: (.stats.skipped // .skipped // null)
            }' ai.test.maintenance/playwright-report/data/test-results.json > "$COUNTS_FILE" || true
          fi

          ENTRY_FILE="$(mktemp)"
          jq -n \
            --arg timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit_sha "${{ github.sha }}" \
            --arg ref "${{ github.ref }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg job_conclusion "${{ needs.playwright-tests.result }}" \
            --argjson counts "$(cat "$COUNTS_FILE")" \
            '{
              timestamp: $timestamp,
              run_url: $run_url,
              commit_sha: $commit_sha,
              ref: $ref,
              branch: $branch,
              job_conclusion: $job_conclusion
            } + $counts' > "$ENTRY_FILE"

          jq -c --slurpfile entry "$ENTRY_FILE" '
            (if type == "array" then . else [] end) + [$entry[0]]
          ' "$PREV_HISTORY_FILE" > ai.test.maintenance/playwright-report/history.json

      # Upload Playwright report as Pages artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai.test.maintenance/playwright-report/

      # Deploy report site to GitHub Pages.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
